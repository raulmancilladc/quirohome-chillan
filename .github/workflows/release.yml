name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    name: Instalador macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: QuiroHome-Live-macOS
          path: release/*.dmg
          if-no-files-found: error

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: QuiroHome-Live-Windows
          path: release/*.exe
          if-no-files-found: error

  release:
    name: Publicar versión
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Nombre de la versión
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: QuiroHome Live ${{ steps.ver.outputs.tag }}
          files: artifacts/**/*
          body: |
            Instaladores de QuiroHome Live.
            - macOS Apple Silicon (M1/M2/M3/M4): archivo `-mac-arm64.dmg`
            - macOS Intel: archivo `-mac-x64.dmg`
            - Windows: archivo `.exe`

            Primera apertura en macOS: clic derecho sobre la app → Abrir → Abrir (la app no está firmada por Apple).
